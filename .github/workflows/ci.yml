# CI for the public checkout: install the package and run its test suite.
# These tests primarily exercise composition, validation and command behavior.
# This workflow does not qualify Slurm or Apptainer runtime isolation.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise the declared minimum and a newer supported interpreter.
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the package the way a user would, from this checkout, rather
      # than adding the source directory to sys.path. An import that only works
      # because the repo happens to be the working directory is not an install.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      # The suite checks that CLI and package versions match pyproject.toml.
      - name: Tests
        run: python -m pytest -q --tb=short

# NO LINT JOB, deliberately. `ruff check` against this repo's own
# [tool.ruff.lint] select-list reports 274 violations today — unsorted imports,
# unused imports, bugbear findings. A job that is red from the first push is
# worse than no job: it trains everyone to ignore the tick, so the first REAL
# failure is invisible too. Clear the backlog, then add the job.
