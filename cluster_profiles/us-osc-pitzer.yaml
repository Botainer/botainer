# OSC Pitzer (Ohio Supercomputer Center).
# https://www.osc.edu/resources/technical_support/supercomputers/pitzer
#
# SCHEDULER: Slurm (OSC switched Pitzer to Slurm on 2020-09-22). OSC also
# layers a PBS-compatibility shim on top so old Torque/Moab-era scripts
# mostly still run, but the native/current scheduler is Slurm — use
# sbatch/squeue, not qsub, for anything new.
#
# NOT RUN ON HARDWARE. Transcribed from public documentation — see
# `verification` below.

version: cluster-profile-v1

verification:
  status: from-public-docs
  last_checked: "2026-07-29"
  source: "https://www.osc.edu/resources/technical_support/supercomputers/pitzer (hardware, ssh host, Slurm-since-2020-09-22), https://www.osc.edu/resources/technical_support/supercomputers/pitzer/batch_limit_rules (partition/queue table), https://www.osc.edu/resources/technical_support/supercomputers/pitzer/guidance_on_requesting_resources_on_pitzer (per-node-type memory figures), https://www.osc.edu/supercomputing/storage-environment-at-osc/available-file-systems (scratch path/quota/purge, home quota), https://www.osc.edu/resources/getting_started/howto/howto_use_docker_and_singularity_containers_at_osc (Apptainer/Singularity support + cache-dir advice). Docs did NOT state: any default partition/account/walltime if unspecified, a home-directory path pattern beyond /users/<project-code>/<user>, or a documented Lmod init/bootstrap script path — all left empty below for that reason."

cluster:
  name: us-osc-pitzer
  aliases: ["pitzer"]   # what $SLURM_CLUSTER_NAME / $LMOD_SYSHOST report
  hostname_patterns:
    - "pitzer.osc.edu"    # the only ssh hostname OSC documents; no login-node
                          # wildcard (e.g. pitzer-login01) is published
  description: "OSC Pitzer (Dell; Intel Xeon Skylake + Cascade Lake; NVIDIA V100)"

lmod:
  bootstrap: ""   # OSC docs describe `module load`/`module spider` usage but
                  # do not publish a module-init/bootstrap script path

slurm:
  # OSC does not document a "default" partition/account/walltime applied when
  # a job omits --partition, so this default_partition is OUR choice (not a
  # documented default), picked the same way Expanse's was: `cpu` is the
  # general-purpose, non-GPU, non-restricted partition and is right for most
  # agent work. `cpu-exp` is the newer (Cascade Lake) equivalent; pick it
  # explicitly for more/faster cores. GPU work needs `gpu`/`gpu-exp`/`gpu-quad`
  # explicitly. `longcpu`, `hugemem`, and `largemem` carry access
  # restrictions or are tiny pools (hugemem: 4 nodes; largemem: 12 nodes) —
  # request only if you actually need them.
  default_partition: cpu
  default_account: ""
  default_time_minutes: 240
  partitions:
    cpu:
      max_time_minutes: 10080       # 168 h; Skylake, standard nodes
      max_cpus: 40
      max_memory_gb: 178
    cpu-exp:
      max_time_minutes: 10080       # 168 h; Cascade Lake expansion nodes
      max_cpus: 48
      max_memory_gb: 178
    longcpu:
      max_time_minutes: 20160       # 336 h; restricted access; 40-core (Skylake) only
      max_cpus: 40
      max_memory_gb: 178
    gpu:
      max_time_minutes: 10080       # 168 h; dual V100 16GB, Skylake nodes
      max_cpus: 40
      max_memory_gb: 363
      gpu_types: [v100]
    gpu-exp:
      max_time_minutes: 10080       # 168 h; dual V100 32GB, Cascade Lake nodes
      max_cpus: 48
      max_memory_gb: 363
      gpu_types: [v100]
    gpu-quad:
      max_time_minutes: 10080       # 168 h; quad V100 32GB w/ NVLink, single node only
      max_cpus: 48
      max_memory_gb: 744
      gpu_types: [v100]
    debug-cpu:
      max_time_minutes: 60          # 40-core (Skylake) nodes
      max_cpus: 40
      max_memory_gb: 178
    debug-exp:
      max_time_minutes: 60          # 48-core (Cascade Lake) nodes
      max_cpus: 48
      max_memory_gb: 178
    gpudebug:
      max_time_minutes: 60          # dual V100 16GB, Skylake
      max_cpus: 40
      max_memory_gb: 363
      gpu_types: [v100]
    gpudebug-exp:
      max_time_minutes: 60          # dual V100 32GB, Cascade Lake
      max_cpus: 48
      max_memory_gb: 363
      gpu_types: [v100]
    hugemem:
      max_time_minutes: 1440        # 24 h; only 4 nodes exist cluster-wide
      max_cpus: 80
      max_memory_gb: 2989
    largemem:
      max_time_minutes: 1440        # 24 h; only 12 nodes exist cluster-wide
      max_cpus: 48
      max_memory_gb: 744

scratch:
  # /fs/scratch is OSC's shared, purged parallel filesystem, visible from all
  # OSC HPC systems and compute nodes — but it is keyed by PROJECT CODE
  # (e.g. /fs/scratch/PAS1234), not by username: docs say "create your own
  # directories under /fs/scratch/<project-code>" and don't document a
  # per-user subdirectory convention. There is no ${USER}-only path here.
  template: "/fs/scratch/${PROJECT_CODE}"
  auto_cleanup_days: 60             # vendor: "not accessed for >= 60 days ... removed every Wednesday"

apptainer:
  # OSC docs: default Apptainer cache is $HOME/.apptainer/cache, and OSC
  # recommends changing it (for build efficiency / to avoid filesystem
  # issues) — they don't prescribe an exact replacement path, so this follows
  # the same scratch-relative convention as the other profiles.
  cachedir: "/fs/scratch/${PROJECT_CODE}/.apptainer/cache"
  prebuilt_url: ""

modules:
  denylist: []
  always_load: []

policy:
  refuse_network: false

agent_hints:
  preamble: |
    You are on OSC Pitzer (Ohio Supercomputer Center).

    SCHEDULER: Slurm (native since 2020-09-22). OSC also runs a PBS-
    compatibility shim so old qsub-style scripts mostly still work, but use
    sbatch/squeue — this is a Slurm cluster, not PBS/Torque.

    Partitions split by CPU generation and by GPU/memory shape:
    - `cpu` (Skylake, 40 cores/node, 178 GB) and `cpu-exp` (Cascade Lake,
      48 cores/node, 178 GB) are the general-purpose non-GPU pools.
    - `gpu` / `gpu-exp` give dual-V100 nodes (16 GB and 32 GB V100s
      respectively); `gpu-quad` gives a single node with 4x V100 32GB over
      NVLink.
    - `hugemem` (80 cores, ~2989 GB, only 4 nodes) and `largemem` (48 cores,
      744 GB, only 12 nodes) are tiny, restricted-size pools — request only
      if you actually need that much memory.
    - `longcpu` allows up to 336 h (14 days) but is access-restricted.
    - Everything else caps at 168 h (7 days); the debug-* / gpudebug-*
      partitions cap at 1 h.

    Filesystems:
    - $HOME (/users/<project-code>/<user>) — 500 GB / 1,000,000 files,
      not increasable, backed up daily.
    - /fs/scratch/<project-code> — the shared, purged working area, visible
      from every OSC system. Files untouched for 60+ days are removed every
      Wednesday. It is keyed by PROJECT CODE, not by username — coordinate
      with your project/allocation before assuming a private path.
    - /fs/ess/<project-code> — durable, quota-billed project storage.
    - $TMPDIR — node-local, per-job scratch; deleted when the job ends.
    - $PFSDIR — per-job scratch on the parallel filesystem (needs
      --gres=pfsdir); also deleted when the job ends.
